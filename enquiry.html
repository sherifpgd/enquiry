<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admission Enquiry</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
/* =====================================================================
   FORM SETTINGS – edit these values for your school, then upload.
   ===================================================================== */
window.FORM_CONFIG = {
  school: "Path Valley International",
  // Google Apps Script web app address (from SETUP.md). Enquiries are saved straight into your sheet.
  apiUrl: "https://script.google.com/macros/s/AKfycbyvkqvTzMiCMbCqtLT387iZzph1rtTaqsUQw7v-YUbbU6H6cPrEGScF9A4uZfWMW6dz/exec",
  // School WhatsApp number with country code, digits only, e.g. "971501234567".
  // Used when apiUrl is empty, or as a backup if saving fails.
  whatsapp: "971551837274",
  hrEmail: "pathvalley2026@gmail.com",   // shown to job seekers
  classes: ["Pre-KG","KG1","KG2","G1","G2","G3","G4","G5","G6","G7","G8","G9","G10","G11","G12"],
  academicYears: ["2026-27","2027-28"],
  heardFrom: ["Instagram","Facebook","Google","Website","Friend / family","Banner / Hoarding","Newspaper","Other"],
  accent: "#1d4ed8"
};
</script>
<style>
:root{--accent:#1d4ed8;--bg:#f4f6f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--surface:#111a2e;--text:#e2e8f0;--muted:#94a3b8;--border:#1e293b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;margin-bottom:18px}
header h1{font-size:22px;margin:6px 0 2px}
header p{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(15,23,42,.06)}
label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 5px}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.seg input{width:auto}
.seg label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.kid{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;margin-bottom:8px}
.x{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 4px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13.5px;color:var(--muted)}
.consent input{width:auto;margin-top:4px}
button.submit{margin-top:18px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button.submit:disabled{opacity:.6;cursor:wait}
.note{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.err{color:var(--danger);font-size:13.5px;margin-top:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:30px 10px}
.done .tick{font-size:46px}
.wa{display:inline-block;margin-top:14px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:10px}
[hidden]{display:none!important}
@media (max-width:420px){.row2{grid-template-columns:1fr}.kid{grid-template-columns:1fr 1fr auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="44" height="44" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="96" fill="var(--accent)"/><path d="M256 112 96 192l160 80 160-80z" fill="#fff"/><path d="M160 236v76c0 28 43 56 96 56s96-28 96-56v-76l-96 48z" fill="#fff" opacity=".9"/></svg>
    <h1 id="school">Admission Enquiry</h1>
    <p>Share a few details and our admissions team will contact you.</p>
  </header>

  <div class="card" id="formcard">
    <form id="f" novalidate>
      <div class="seg" role="radiogroup" aria-label="Enquiry about">
        <label><input type="radio" name="type" value="Admission" checked> Admission</label>
        <label><input type="radio" name="type" value="Job"> Job vacancy</label>
      </div>

      <div id="jobnote" class="note" hidden></div>

      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required>

      <div class="row2">
        <div><label for="phone">Mobile / WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="05X XXX XXXX"></div>
        <div><label for="email">Email <span class="opt">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email"></div>
      </div>

      <div id="adm">
        <label>Child / children</label>
        <div id="kids"></div>
        <button type="button" class="link" id="addkid">+ Add another child</button>

        <div class="row2">
          <div><label for="year">Academic year</label><select id="year" name="academicYear"></select></div>
          <div><label for="transport">School transport needed?</label>
            <select id="transport" name="transport"><option value="">Not sure</option><option>Yes</option><option>No</option></select></div>
        </div>
        <label for="location">Area you live in <span class="opt">(optional)</span></label>
        <input id="location" name="location" placeholder="e.g. Shabiya, Muroor">
      </div>

      <div id="heardwrap">
        <label for="heard">How did you hear about us?</label>
        <select id="heard" name="source"><option value=""></option></select>
      </div>

      <label for="message">Message <span class="opt">(optional)</span></label>
      <textarea id="message" name="message" placeholder="Any questions about fees, curriculum, transport…"></textarea>

      <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>

      <label class="consent"><input type="checkbox" id="consent" required> I agree to be contacted by the school by phone, WhatsApp or email about this enquiry.</label>

      <div class="err" id="err" role="alert"></div>
      <button class="submit" type="submit" id="go">Send enquiry</button>
    </form>
  </div>

  <div class="card done" id="done" hidden>
    <div class="tick">✅</div>
    <h2 style="margin:6px 0">Thank you!</h2>
    <p id="donemsg">We have received your enquiry. Our admissions team will contact you shortly.</p>
    <a class="wa" id="walink" hidden target="_blank" rel="noopener">Send on WhatsApp</a>
  </div>
</div>

<script>
"use strict";
const P = new URLSearchParams(location.search);
const C = Object.assign({}, window.FORM_CONFIG);
if (P.get("s")) C.school = P.get("s");
if (P.get("w")) C.whatsapp = P.get("w").replace(/\D/g, "");
const SRC = P.get("src") || "", CAMP = P.get("c") || "";
document.documentElement.style.setProperty("--accent", C.accent || "#1d4ed8");
document.title = `Admission Enquiry – ${C.school}`;
const $ = s => document.querySelector(s);
$("#school").textContent = C.school;
$("#year").innerHTML = C.academicYears.map(y => `<option>${y}</option>`).join("");
$("#year").value = C.academicYears[C.academicYears.length - 1];
$("#heard").innerHTML += C.heardFrom.map(h => `<option>${h}</option>`).join("");
if (SRC) $("#heardwrap").hidden = true;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function addKid(){
  if (document.querySelectorAll(".kid").length >= 5) return;
  $("#kids").insertAdjacentHTML("beforeend", `<div class="kid"><input placeholder="Child's name" class="kn" aria-label="Child's name"><select class="kc" aria-label="Class"><option value="">Class…</option>${C.classes.map(c => `<option>${esc(c)}</option>`).join("")}</select><button type="button" class="x" aria-label="Remove">×</button></div>`);
}
addKid();
$("#addkid").onclick = addKid;
$("#kids").addEventListener("click", e => { if (e.target.classList.contains("x") && document.querySelectorAll(".kid").length > 1) e.target.closest(".kid").remove(); });

const syncType = () => {
  const job = $("#f").type.value === "Job";
  $("#adm").hidden = job;
  $("#jobnote").hidden = !job;
  $("#jobnote").innerHTML = C.hrEmail ? `For job vacancies, please email your CV to <a href="mailto:${esc(C.hrEmail)}">${esc(C.hrEmail)}</a>. You can also leave your details below.` : "Leave your details and our HR team will contact you if there is a suitable opening.";
};
document.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener("change", syncType));
syncType();

function buildMessage(q){
  const lines = [`*${q.type === "Job" ? "Job" : "Admission"} Enquiry – ${C.school}*`, `Parent: ${q.name}`, `Phone: ${q.phone}`];
  if (q.email) lines.push(`Email: ${q.email}`);
  if (q.type !== "Job") {
    if (q.location) lines.push(`Area: ${q.location}`);
    q.children.forEach((k, i) => lines.push(`Child ${i + 1}: ${k.name || "-"} – ${k.cls || "-"}`));
    if (q.academicYear) lines.push(`Academic year: ${q.academicYear}`);
    if (q.transport) lines.push(`Transport: ${q.transport}`);
  } else lines.push("Type: Job");
  if (q.source) lines.push(`Source: ${q.source}`);
  if (q.campaign) lines.push(`Campaign: ${q.campaign}`);
  if (q.message) lines.push(`Message: ${q.message}`);
  return lines.join("\n");
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, err = $("#err"); err.textContent = "";
  const q = {
    type: f.type.value, name: f.name.value.trim(), phone: f.phone.value.trim(), email: f.email.value.trim(),
    location: f.location.value.trim(), academicYear: f.academicYear.value, transport: f.transport.value,
    source: SRC || f.source.value || "Online form", campaign: CAMP, message: f.message.value.trim(), website: f.website.value,
    children: [...document.querySelectorAll(".kid")].map(r => ({ name: r.querySelector(".kn").value.trim(), cls: r.querySelector(".kc").value })).filter(k => k.name || k.cls)
  };
  if (q.type === "Job") q.children = [];
  if (!q.name) { err.textContent = "Please enter your name."; f.name.focus(); return; }
  if (q.phone.replace(/\D/g, "").length < 8) { err.textContent = "Please enter a valid mobile number."; f.phone.focus(); return; }
  if (q.type !== "Job" && !q.children.some(k => k.cls)) { err.textContent = "Please choose the class you are enquiring for."; document.querySelector(".kc").focus(); return; }
  if (!$("#consent").checked) { err.textContent = "Please tick the box to agree to be contacted."; return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Sending…";
  const msg = buildMessage(q);
  const wa = C.whatsapp ? `https://wa.me/${C.whatsapp}?text=${encodeURIComponent(msg)}` : "";
  let saved = false;
  if (C.apiUrl) {
    try {
      const r = await fetch(C.apiUrl, { method: "POST", body: JSON.stringify({ action: "submit", enquiry: q }) });
      const j = await r.json();
      if (j.ok) saved = true; else if (j.error) err.textContent = j.error;
    } catch (ex) {}
  }
  btn.disabled = false; btn.textContent = "Send enquiry";
  if (saved) {
    $("#formcard").hidden = true; $("#done").hidden = false;
    $("#donemsg").textContent = q.type === "Job" ? "Thank you for your interest. Our HR team will contact you if there is a suitable opening." : "We have received your enquiry. Our admissions team will contact you shortly.";
    if (wa) { $("#walink").hidden = false; $("#walink").href = wa; $("#walink").textContent = "Chat with us on WhatsApp"; }
    return;
  }
  if (wa) {
    $("#formcard").hidden = true; $("#done").hidden = false;
    $("#donemsg").textContent = "Almost done – tap the button below to send your enquiry to us on WhatsApp.";
    $("#walink").hidden = false; $("#walink").href = wa; $("#walink").textContent = "Send on WhatsApp";
    window.open(wa, "_blank", "noopener");
    return;
  }
  if (!err.textContent) err.textContent = "Sorry, the enquiry could not be sent right now. Please call the school.";
});
</script>
</body>
</html>
